      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="grid_exit" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg_exit)"/>
  <rect width="640" height="480" fill="url(#grid_exit)"/>

  <!-- Camera HUD Corners -->
