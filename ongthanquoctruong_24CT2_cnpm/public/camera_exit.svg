  <text x="35" y="457" fill="#94a3b8" font-family="monospace" font-size="11">HỆ THỐNG KIỂM SOÁT TỰ ĐỘNG • ĐỐI SOÁT BIỂN SỐ VÀO/RA KHỚP 100%</text>
</svg>
