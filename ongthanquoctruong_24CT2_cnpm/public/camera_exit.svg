  </circle>
  <text x="64" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CAM 02: CỔNG RA (ĐỐI SOÁT) • LIVE</text>
  <text x="590" y="53" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="end" font-weight="600">FPS: 29.8 | AI: CRNN-OCR</text>

  <!-- AI Target Box -->
  <rect x="180" y="160" width="280" height="170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="235" y="270" width="170" height="48" fill="#18181b" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="320" y="302" fill="#facc15" font-family="monospace" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="2">29A - 678.90</text>
  <text x="320" y="335" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Vé tháng: Cư dân căn 05.11 • Hợp lệ</text>

  <!-- Crosshair center -->
  <line x1="320" y1="230" x2="320" y2="250" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="310" y1="240" x2="330" y2="240" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Footer HUD -->
