  <path d="M 30 430 L 30 450 L 50 450" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <path d="M 610 430 L 610 450 L 590 450" stroke="#f59e0b" stroke-width="2.5" fill="none"/>

  <!-- Live Tag -->
  <circle cx="48" cy="48" r="6" fill="#10b981">
