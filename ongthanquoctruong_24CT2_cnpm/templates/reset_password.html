<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại Mật Khẩu | Quản Lý Biển Số Xe AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --background: #f8fafc;
            --foreground: #020817;
            --card: #ffffff;
            --primary: #0f172a;
            --primary-foreground: #f8fafc;
            --muted: #f1f5f9;
            --muted-foreground: #64748b;
            --border: #e2e8f0;
            --input: #e2e8f0;
            --ring: #0f172a;
            --radius: 0.5rem;
            --destructive: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(at 0% 0%, rgba(15, 23, 42, 0.03) 0px, transparent 50%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            padding: 2.25rem 2rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-badge {
            width: 44px;
            height: 44px;
            background: var(--primary);
            color: var(--primary-foreground);
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .card-description {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin-top: 0.25rem;
        }

        .form-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.15rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            height: 2.6rem;
            padding: 0 0.85rem;
            background: var(--card);
            border: 1px solid var(--input);
            border-radius: var(--radius);
            font-size: 0.925rem;
            color: var(--foreground);
            transition: all 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--ring);
            box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 2.65rem;
            padding: 0 1rem;
            font-size: 0.925rem;
            font-weight: 600;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
        }
        .btn-primary:hover { background: #1e293b; }

        .alert-box {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 0.85rem;
            display: none;
            margin-top: 1rem;
        }
        .alert-box.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; display: flex; align-items: center; gap: 0.5rem; }
        .alert-box.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; display: flex; align-items: center; gap: 0.5rem; }

        .card-footer {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }
        .card-footer a { color: var(--foreground); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="card-header">
            <div class="brand-badge">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="card-title">Đặt lại mật khẩu</h1>
            <p class="card-description">Nhập mã xác thực OTP từ email và thiết lập mật khẩu mới.</p>
        </div>

        <form id="resetForm">
            <div class="form-item">
                <label class="form-label" for="email">Địa chỉ Email</label>
                <input class="form-input" id="email" name="email" type="email" placeholder="email@domain.com" required>
            </div>

            <div class="form-item">
                <label class="form-label" for="otp">Mã xác thực OTP</label>
                <input class="form-input" id="otp" name="otp" placeholder="Nhập 6 chữ số OTP" required style="letter-spacing: 2px; font-weight: 700; text-align: center;">
            </div>

            <div class="form-item">
                <label class="form-label" for="newPassword">Mật khẩu mới</label>
                <input class="form-input" id="newPassword" name="new_password" type="password" placeholder="Tối thiểu 6 ký tự" required>
            </div>

            <div class="alert-box" id="alertBox"></div>

            <button type="submit" class="btn btn-primary" id="submitBtn" style="margin-top: 0.5rem;">
                Xác nhận đổi mật khẩu
            </button>
        </form>

        <div class="card-footer">
            Quay lại <a href="/login">Đăng nhập</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email') || sessionStorage.getItem('reset_email') || '';
        if (emailParam) {
            document.getElementById('email').value = emailParam;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            alertBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';

            const payload = {
                email: document.getElementById('email').value.trim(),
                otp: document.getElementById('otp').value.trim(),
                new_password: document.getElementById('newPassword').value
            };

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    alertBox.className = 'alert-box error';
                    alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${data.error || 'Đặt lại mật khẩu thất bại'}`;
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btn.textContent = 'Xác nhận đổi mật khẩu';
                    return;
                }

                alertBox.className = 'alert-box success';
                alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Đổi mật khẩu thành công! Đang chuyển hướng đăng nhập...';
                alertBox.style.display = 'flex';

                sessionStorage.removeItem('reset_email');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1200);
            } catch (err) {
                alertBox.className = 'alert-box error';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Lỗi kết nối: ${err.message}`;
                alertBox.style.display = 'flex';
                btn.disabled = false;
                btn.textContent = 'Xác nhận đổi mật khẩu';
            }
        });
    </script>
</body>
</html>
